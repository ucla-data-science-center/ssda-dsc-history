<script>
// Acronym tooltips (tags added by acronyms.lua) and "Edit this page" links at the top and
// bottom of each page. The edit URL comes from Quarto's own repo-actions link, so it stays
// right per page. The repo is private: the link works for DSC team members only.
document.addEventListener("DOMContentLoaded", function () {
  // Navbar and footer text also passes through acronyms.lua; keep tags only in the page body.
  document.querySelectorAll("abbr[title]").forEach(function (el) {
    if (!el.closest("main")) el.replaceWith(document.createTextNode(el.textContent));
  });
  if (window.bootstrap && bootstrap.Tooltip) {
    document.querySelectorAll("main abbr[title]").forEach(function (el) {
      new bootstrap.Tooltip(el, { trigger: "hover focus", placement: "top" });
    });
  }
  // Mark the current page and its menu as active in the shared navbar (links to the other site are absolute).
  document.querySelectorAll(".navbar .dropdown-item").forEach(function (a) {
    if (a.pathname === location.pathname) {
      a.classList.add("active");
      a.setAttribute("aria-current", "page");
      var toggle = a.closest(".dropdown") && a.closest(".dropdown").querySelector(".nav-link.dropdown-toggle");
      if (toggle) toggle.classList.add("active");
    }
  });
  // Boat of Hope: swap the still image for the live viewer on request, and back.
  document.querySelectorAll(".boat-stage").forEach(function (stage) {
    var img = stage.querySelector("img"), btn = stage.querySelector(".boat-toggle"), frame = null;
    btn.addEventListener("click", function () {
      if (!frame) {
        frame = document.createElement("iframe");
        frame.src = stage.dataset.embed;
        frame.title = "Boat of Hope 3D narrative, live viewer";
        frame.loading = "lazy";
        frame.setAttribute("allow", "fullscreen");
        frame.setAttribute("allowfullscreen", "");
        stage.insertBefore(frame, img);
        img.hidden = true;
        btn.textContent = "Back to still image";
        btn.setAttribute("aria-pressed", "true");
        btn.style.bottom = "auto"; btn.style.top = "10px";
      } else {
        frame.remove(); frame = null;
        img.hidden = false;
        btn.textContent = "Explore in 3D here";
        btn.setAttribute("aria-pressed", "false");
        btn.style.top = ""; btn.style.bottom = "";
      }
    });
  });
  var src = document.querySelector('.toc-actions a[href*="/edit/"]');
  if (!src) return;
  function editLink(cls) {
    var p = document.createElement("p");
    p.className = "page-edit-link " + cls;
    p.innerHTML = '<a href="' + src.href + '"><i class="bi bi-pencil" aria-hidden="true"></i> Edit this page</a> <span class="page-edit-note">(DSC team; repository access required)</span>';
    return p;
  }
  var header = document.querySelector("#title-block-header");
  if (header) header.insertAdjacentElement("afterend", editLink("page-edit-top"));
  var main = document.querySelector("main");
  if (main) main.appendChild(editLink("page-edit-bottom"));
});
</script>
