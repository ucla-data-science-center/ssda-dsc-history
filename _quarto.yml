project:
  type: website
  output-dir: _site
  resources:
    - images/brand/**   # DSC logo and identity elements (some referenced only from CSS)
  render:
    - history.qmd
    - history-companion.qmd

website:
  title: "UCLA's Social Science Data Archive: an institutional history"
  favicon: images/brand/dsc-cube.svg
  repo-url: https://github.com/ucla-data-science-center/ssda-dsc-history
  repo-branch: main
  reader-mode: true
  draft-mode: visible
  # Theme and navbar mirror dsc-stats-reports (DSC 2019 identity) so the two
  # sites read as one; each links to the other.
  navbar:
    background: primary
    logo: images/brand/dsc-logo-white.svg
    logo-alt: "UCLA Library Data Science Center"
    logo-href: https://ucla-data-science-center.github.io/dsc-stats-reports/index.html
    title: "Data Science Center record"
    left:
      - text: "Research enabled"
        menu:
          - text: "Home"
            href: https://ucla-data-science-center.github.io/dsc-stats-reports/index.html
          - text: "Research enabled"
            href: https://ucla-data-science-center.github.io/dsc-stats-reports/research.html
          - text: "Research capability built"
            href: https://ucla-data-science-center.github.io/dsc-stats-reports/capability.html
          - text: "Shared investments"
            href: https://ucla-data-science-center.github.io/dsc-stats-reports/investments.html
          - text: "Consulting"
            href: https://ucla-data-science-center.github.io/dsc-stats-reports/consulting.html
          - text: "Instruction"
            href: https://ucla-data-science-center.github.io/dsc-stats-reports/instruction.html
          - text: "Infrastructure"
            href: https://ucla-data-science-center.github.io/dsc-stats-reports/infrastructure.html
          - text: "About and methodology"
            href: https://ucla-data-science-center.github.io/dsc-stats-reports/about.html
      - text: "Archive history"
        menu:
          - text: "The history, 1961 to 2026"
            href: history.html
          - text: "Evidence companion"
            href: history-companion.html
  # Same link groups and styling as the research site's footer (dsc-stats-reports)
  page-footer:
    left: |
      [Explore]{.footer-heading}

      [Research Enabled by DSC](https://ucla-data-science-center.github.io/dsc-stats-reports/)\
      [Archive history since 1961](https://ucla-data-science-center.github.io/ssda-dsc-history/history.html)\
      [How figures are counted](https://ucla-data-science-center.github.io/dsc-stats-reports/about.html)
    center: |
      [Use the services]{.footer-heading}

      [UCLA Dataverse](https://dataverse.ucla.edu/)\
      [DataSquad student projects](https://ucla-datasquad.github.io/)\
      [Data Science Center at UCLA Library](https://www.library.ucla.edu/visit/locations/data-science-center/)\
      [Request a research consultation](https://uclalibrary.atlassian.net/servicedesk/customer/portal/5)
    right: |
      [Help improve this record]{.footer-heading}

      [Report a correction](https://github.com/ucla-data-science-center/dsc-stats-reports/issues/new?template=correction.yml)

format:
  html:
    theme:
      light: [flatly, dsc-light.scss]
      dark: [darkly, dsc-dark.scss]
    css: styles.css
    include-in-header: _head.html
    include-after-body: [_brand-strip.html, _page-extras.html]
    filters: [acronyms.lua]
    smooth-scroll: true
    toc: true
    toc-depth: 3
    number-sections: false
    citations-hover: true
  pdf:
    documentclass: scrartcl
    papersize: letter
    geometry: "margin=1in"
    fontsize: 11pt
    toc: true
    toc-depth: 3
    number-sections: false
